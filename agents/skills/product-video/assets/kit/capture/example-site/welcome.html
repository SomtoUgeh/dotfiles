<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      body { margin: 0; background: #fbfaf8; color: #1c1b19; }
      header { padding: 22px 40px; font-weight: 600; font-size: 20px; border-bottom: 1px solid #e6e3dc; }
      main { max-width: 860px; margin: 56px auto 400px; padding: 0 24px; }
      h1 { font-size: 44px; letter-spacing: -0.03em; margin: 0 0 8px; }
      p { color: #6f6c66; font-size: 18px; margin: 0 0 32px; }
      ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 16px; }
      li { background: #fff; border: 1px solid #e6e3dc; border-radius: 14px; padding: 22px 24px;
        display: flex; gap: 18px; align-items: center; font-size: 20px; }
      li span { width: 38px; height: 38px; border-radius: 19px; background: #dfe7f5; color: #14213d;
        display: grid; place-items: center; font-weight: 600; flex-shrink: 0; }
      li small { display: block; color: #6f6c66; font-size: 16px; margin-top: 2px; }
    </style>
  </head>
  <body>
    <header>Your Product</header>
    <main>
      <h1 id="hello">Welcome</h1>
      <p>Your workspace is ready. Here is what to do next.</p>
      <ol data-testid="next-steps">
        <li><span>1</span><div>Invite your team<small>Add people by email.</small></div></li>
        <li><span>2</span><div>Connect a calendar<small>Meetings appear on your home page.</small></div></li>
        <li><span>3</span><div>Create your first project<small>Start from a template or from nothing.</small></div></li>
      </ol>
    </main>
    <script>
      const name = new URLSearchParams(location.search).get("name");
      if (name) document.getElementById("hello").textContent = "Welcome, " + name.split(" ")[0];
    </script>
  </body>
</html>
