model = "gpt-6-astra"
model_reasoning_effort = "high"
personality = "pragmatic"
service_tier = "fast"

[features]
apps = true
chronicle = true
goals = true
js_repl = true
memories = true
multi_agent = true
prevent_idle_sleep = true

[mcp_servers.cloudflare]
url = "https://mcp.cloudflare.com/mcp"

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"

[mcp_servers.context7.env_http_headers]
CONTEXT7_API_KEY = "CONTEXT7_API_KEY"

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp"

[mcp_servers.granola]
url = "https://mcp.granola.ai/mcp"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.paper]
url = "http://127.0.0.1:29979/mcp"

[mcp_servers.playwright]
args = ["@playwright/mcp@latest"]
command = "npx"

[mcp_servers.posthog]
url = "https://mcp-eu.posthog.com/mcp"

[mcp_servers.postman]
url = "https://mcp.postman.com/mcp"

[plugins."canva@openai-curated"]
enabled = true

[plugins."codex-security@openai-curated"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."figma@openai-curated"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

[plugins."gmail@openai-curated"]
enabled = true

[plugins."google-calendar@openai-curated"]
enabled = true

[plugins."google-drive@openai-curated"]
enabled = true

[plugins."granola@openai-curated"]
enabled = true

[plugins."linear@openai-curated"]
enabled = true

[plugins."neon-postgres@openai-curated"]
enabled = true

[plugins."notion@openai-curated"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."remotion@openai-curated"]
enabled = true

[plugins."slack@openai-curated"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."superpowers@openai-curated"]
enabled = true

[plugins."code-review@claude-plugins-official"]
enabled = true

[plugins."context7@claude-plugins-official"]
enabled = true

[plugins."explanatory-output-style@claude-plugins-official"]
enabled = true

[plugins."frontend-design@claude-plugins-official"]
enabled = false

[plugins."codex@openai-codex"]
enabled = true

[plugins."browser-use@openai-bundled"]
enabled = true

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
DISABLE_COST_WARNINGS = "1"
DISABLE_ERROR_REPORTING = "1"
DISABLE_NON_ESSENTIAL_MODEL_CALLS = "1"
DISABLE_TELEMETRY = "1"
MAX_MCP_OUTPUT_TOKENS = "20000"
MAX_THINKING_TOKENS = "25999"
MCP_TIMEOUT = "60000"
MCP_TOOL_TIMEOUT = "60000"
OTEL_EXPORTER_OTLP_ENDPOINT = "http://localhost:4317"
OTEL_EXPORTER_OTLP_PROTOCOL = "grpc"
OTEL_LOGS_EXPORTER = "otlp"
OTEL_LOGS_EXPORT_INTERVAL = "50000"
OTEL_LOG_TOOL_DETAILS = "1"
OTEL_METRICS_EXPORTER = "otlp"
OTEL_METRIC_EXPORT_INTERVAL = "60000"
TASK_MAX_OUTPUT_LENGTH = "25000"

[tui]
status_line = [
    "model-with-reasoning",
    "context-remaining",
    "current-dir",
    "git-branch",
    "context-used",
    "context-window-size",
    "five-hour-limit",
    "weekly-limit",
    "codex-version",
]
